name: PR Lifecycle

# Centralised PR lifecycle for every repository in the organisation.
#
# The merge gate is a single check run named "ai-review", published by the AI Reviewer
# App and pinned in each ruleset to that App's integration_id. Nothing else can publish
# it — verified: the Developer App posting a check of the same name leaves the PR blocked.
#
# The verdict job runs with if: always() on purpose. A repository whose ruleset requires
# "ai-review" deadlocks permanently if the check is never published, so every path
# through this workflow must end in a published verdict, success or failure.
#
# Never switch to pull_request_target. It would expose these secrets to fork PRs.

on:
  workflow_call:
    inputs:
      language:
        description: 'node | powershell | none — selects setup and default test command'
        type: string
        default: none
      test-command:
        description: 'Overrides the language default. Empty string skips tests.'
        type: string
        default: ''
      enable-agents:
        description: 'Run the AI reviewer and developer. Flow, guard and tests run either way.'
        type: boolean
        default: false
      ai-branch:
        type: string
        default: ai-driven1
      max-changed-files:
        type: number
        default: 20
      max-changed-lines:
        type: number
        default: 400
      max-rounds:
        description: 'Reviewer rounds before handing over to a human.'
        type: number
        default: 5
      agent-logins:
        description: >-
          Comma-separated logins treated as agents. Both spellings are included on purpose:
          webhook payloads use "<slug>[bot]" while `gh pr view --json author` returns
          "app/<slug>", and matching only one silently classifies every agent pull request
          as human.
        type: string
        default: 'lakshmanachari-panuganti[bot],app/lakshmanachari-panuganti,devils-advocate-review[bot],app/devils-advocate-review,omg-ai-developer,devilsadvocate-reviewer'
      agent-protected-paths:
        description: >-
          Comma-separated wildcard patterns the AI branch may not modify. These are the files
          CI executes with credentials, not merely sensitive ones. Extend per repository;
          do not narrow without deciding what runs the removed path.
        type: string
        default: '.github/*,.github/**,infra/*,infra/**,package.json,**/package.json,package-lock.json,**/package-lock.json,next.config.*,**/next.config.*,*.psd1,**/*.psd1'

concurrency:
  group: pr-lifecycle-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Left at contents: read. The organisation's default workflow permission is "read", and a
# reusable workflow cannot request more than its caller holds — adding pull-requests: read
# here failed every run with startup_failure before any job began. Anything needing more
# than contents uses an App token.
permissions:
  contents: read

env:
  ADMIN_REPO: lakshmanachari-panuganti/Repository-Administration-Governance

jobs:
  # ------------------------------------------------------------------------- flow
  # Enforces the promotion path:
  #
  #     feature ──> ai-driven1 ──> develop ──> main
  #
  # main only accepts develop. Nothing else reaches production without passing through
  # develop first. A ruleset cannot express "which branch may open this PR", so it is
  # enforced here and surfaced through the ai-review gate.
  flow:
    name: Branch Flow
    # pull_request only. On a pull_request_review event there is nothing new to validate,
    # and running anyway leaves a red check and a failed run on a pull request that is
    # merely being approved.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion path
        id: validate
        shell: pwsh
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          AI_BRANCH: ${{ inputs.ai-branch }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          $base = $env:BASE
          $head = $env:HEAD
          $ai   = $env:AI_BRANCH
          Write-Host "$head -> $base"

          # Dependabot SECURITY updates always target the default branch and ignore
          # target-branch in dependabot.yml — GitHub provides no setting for it. Closing
          # them would silently stop every security fix from ever reaching the repository,
          # so they are retargeted onto the promotion path instead of rejected.
          #
          # Matched on the numeric author id, never the branch name. A branch called
          # dependabot/anything can be created by any identity with push access; user id
          # 49699333 cannot be claimed. Verified against a live Dependabot pull request.
          if ($base -eq 'main' -and $env:AUTHOR_ID -eq '49699333' -and $env:AUTHOR_TYPE -eq 'Bot') {
              Write-Host 'Dependabot security update targeting main. Retargeting to develop.'
              'retarget=true' >> $env:GITHUB_OUTPUT
              'violation=' >> $env:GITHUB_OUTPUT
              exit 0
          }
          'retarget=false' >> $env:GITHUB_OUTPUT

          $violation = switch ($base) {
              'main' {
                  if ($head -ne 'develop') {
                      "main only accepts pull requests from develop. This one is from '$head'. Every change must pass through develop before reaching production."
                  }
              }
              'develop' {
                  if ($head -eq 'main') { "develop cannot take a pull request from main." }
              }
              default {
                  if ($head -in @('main', 'develop')) {
                      "'$head' cannot open a pull request into '$base' — that reverses the promotion path."
                  }
              }
          }

          if ($violation) {
              Write-Host "::error::$violation"
              "violation=$violation" >> $env:GITHUB_OUTPUT
              exit 1
          }
          "violation=" >> $env:GITHUB_OUTPUT
          Write-Host 'Promotion path is valid.'

      - name: Retarget a Dependabot security update onto develop
        if: steps.validate.outputs.retarget == 'true'
        uses: actions/create-github-app-token@v1
        id: retarget-token
        with:
          app-id: ${{ vars.AI_DEVELOPER_APP_ID }}
          private-key: ${{ secrets.AI_DEVELOPER_APP_KEY }}

      - name: Move it to develop
        if: steps.validate.outputs.retarget == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.retarget-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Closing these would silently stop every security fix from reaching the
          # repository, because Dependabot ignores target-branch for security updates and
          # always opens them against the default branch. Retargeting keeps exactly one
          # path into main while letting the fix flow.
          $body = @(
              'Retargeted from `main` to `develop` automatically.'
              ''
              'Dependabot opens security updates against the default branch and ignores'
              '`target-branch` for them, but `main` only accepts pull requests from'
              '`develop`. This change now follows the promotion path and will reach'
              '`main` with the next release.'
          ) -join "`n"

          gh api -X POST "/repos/$env:REPO/issues/$env:PR_NUMBER/comments" -f "body=$body" | Out-Null
          gh api -X PATCH "/repos/$env:REPO/pulls/$env:PR_NUMBER" -f base='develop' --jq '"base is now " + .base.ref'

      # A failing check is not enough on its own. Check runs are keyed by commit, not by
      # pull request, so one commit that is the head of two pull requests has ONE
      # ai-review check between them. Opening ai-driven1 -> develop and ai-driven1 -> main
      # from the same commit lets the main-targeted pull request inherit the green verdict
      # published for the develop-targeted one — verified, the illegal pull request showed
      # ai-review: success.
      #
      # Closing the pull request removes it rather than relying on a check that a sibling
      # can overwrite.
      - name: Close a pull request that breaks the promotion path
        if: failure()
        uses: actions/create-github-app-token@v1
        id: reviewer-token
        with:
          app-id: ${{ vars.AI_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI_REVIEWER_APP_KEY }}

      - name: Close it
        if: failure() && steps.reviewer-token.outputs.token != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VIOLATION: ${{ steps.validate.outputs.violation }}
        run: |
          $body = @(
              'This pull request does not follow the promotion path and has been closed automatically.'
              ''
              "> $env:VIOLATION"
              ''
              '```'
              'feature ──> ai-driven1 ──> develop ──> main'
              '```'
              ''
              'Open it against the correct base branch instead.'
          ) -join "`n"

          gh api -X POST "/repos/$env:REPO/issues/$env:PR_NUMBER/comments" -f "body=$body" | Out-Null
          gh api -X PATCH "/repos/$env:REPO/pulls/$env:PR_NUMBER" -f state='closed' --jq '.state'

  # ------------------------------------------------------------------ eligibility
  eligibility:
    name: Eligibility
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.gate.outputs.agents }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Evaluate
        id: gate
        shell: pwsh
        env:
          ENABLE_AGENTS: ${{ inputs.enable-agents }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AI_BRANCH: ${{ inputs.ai-branch }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          $blocked = @()
          if ($env:ENABLE_AGENTS -ne 'true')       { $blocked += 'agents disabled for this repository' }
          if ($env:IS_FORK -eq 'true')             { $blocked += 'fork pull request' }
          if ($env:IS_DRAFT -eq 'true')            { $blocked += 'draft' }
          if ($env:HEAD_REF -ne $env:AI_BRANCH)    { $blocked += "head is $env:HEAD_REF, agents only act on $env:AI_BRANCH" }
          if ($env:BASE_REF -eq 'main')            { $blocked += 'target is main; production changes are reviewed by a human' }
          if (($env:LABELS -split ',') -contains 'needs-human') { $blocked += 'needs-human label' }

          if ($blocked.Count -gt 0) {
              $reason = $blocked -join '; '
              Write-Host "Agents will not run: $reason"
              "agents=false"   >> $env:GITHUB_OUTPUT
              "reason=$reason" >> $env:GITHUB_OUTPUT
          }
          else {
              "agents=true" >> $env:GITHUB_OUTPUT
              "reason="     >> $env:GITHUB_OUTPUT
          }

  # ------------------------------------------------------------------------ guard
  # Invariants the agents are only *instructed* to follow. A prompt-injected or
  # misbehaving agent cannot talk its way past these — they are measured, not asked.
  guard:
    name: Guard
    needs: flow
    # Same reason as flow: the diff has not changed when someone submits a review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check invariants
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_FILES: ${{ inputs.max-changed-files }}
          MAX_LINES: ${{ inputs.max-changed-lines }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AI_BRANCH: ${{ inputs.ai-branch }}
          AGENT_PROTECTED_PATHS: ${{ inputs.agent-protected-paths }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          AGENT_LOGINS: ${{ inputs.agent-logins }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = @()

          $files = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
          Write-Host "Changed files: $($files.Count)"

          # develop -> main is a promotion of already-reviewed work; size limits there
          # would block a legitimate release.
          if ($env:BASE_REF -ne 'main') {
              if ($files.Count -gt [int]$env:MAX_FILES) {
                  $failed += "$($files.Count) files changed, limit is $env:MAX_FILES"
              }

              $stat = git diff --shortstat "$env:BASE_SHA...$env:HEAD_SHA"
              $ins = if ($stat -match '(\d+) insertion') { [int]$Matches[1] } else { 0 }
              $del = if ($stat -match '(\d+) deletion')  { [int]$Matches[1] } else { 0 }
              Write-Host "Changed lines: $($ins + $del)"
              if (($ins + $del) -gt [int]$env:MAX_LINES) {
                  $failed += "$($ins + $del) lines changed, limit is $env:MAX_LINES"
              }

              # The agents must not rewrite the CI that constrains them. Scoped to the AI
              # branch on purpose: a human changing CI is ordinary work that goes through
              # review, and forbidding it outright blocks the very pull request that
              # onboards a repository onto this workflow.
              # Scoped by AUTHOR, not by branch. Branch names are chosen by whoever pushes,
              # so an agent that opened a pull request from feature/x rather than the AI
              # branch would previously have skipped this check entirely. The author
              # identity cannot be chosen.
              #
              # github.event.pull_request.user.login is the "<slug>[bot]" spelling. Note it
              # differs from `gh pr view --json author`, which returns "app/<slug>" — both
              # are matched here so the list stays correct wherever it is reused.
              $agentLogins = @($env:AGENT_LOGINS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
              $isAgentAuthored = [bool](@($agentLogins | Where-Object { $_ -eq $env:PR_AUTHOR }).Count)
              Write-Host "author: $env:PR_AUTHOR (agent-authored: $isAgentAuthored)"

              if ($isAgentAuthored) {
                  # Withholding workflows:write from the Developer App stops it editing
                  # .github/workflows, but not the other files that CI executes with
                  # credentials: package.json scripts run on every npm ci, infra/** carries
                  # the deployment definitions, and next.config.* runs at build time. Those
                  # jobs hold Azure OIDC, so an agent editing any of them reaches production
                  # without ever touching a workflow file.
                  #
                  # GitHub Free has no per-path ruleset restriction, so it has to live here.
                  $protected = @($env:AGENT_PROTECTED_PATHS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
                  $touched = $files | Where-Object {
                      $file = $_
                      $protected | Where-Object { $file -like $_ }
                  }
                  if ($touched) {
                      $failed += "agent branch touched protected paths: $($touched -join ', ')"
                  }
              }
          }
          else {
              Write-Host 'Promotion to main: size and workflow limits do not apply.'
          }

          if ($failed.Count -gt 0) {
              Write-Host "::error::Guard failed. $($failed -join ' | ')"
              exit 1
          }
          Write-Host 'Guard passed.'

      - name: Set up Node
        if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        shell: pwsh
        env:
          LANGUAGE: ${{ inputs.language }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          $cmd = $env:TEST_COMMAND

          if ([string]::IsNullOrWhiteSpace($cmd)) {
              # A repository with no tests must not fail the guard. Both default commands
              # treat "nothing to run" as an error — Invoke-Pester exits non-zero with
              # "No test files were found", and npm test fails when no test script is
              # defined. That turns a coverage gap into a blocked pull request.
              #
              # Missing tests are reported loudly instead, so the gap stays visible.
              switch ($env:LANGUAGE) {
                  'node' {
                      if (-not (Test-Path package.json)) {
                          Write-Host '::warning::language is node but there is no package.json. No tests run.'
                          return
                      }
                      $pkg = Get-Content package.json -Raw | ConvertFrom-Json
                      $hasTest = $pkg.PSObject.Properties.Name -contains 'scripts' -and
                                 $pkg.scripts.PSObject.Properties.Name -contains 'test'
                      if (-not $hasTest) {
                          Write-Host '::warning::package.json defines no test script. No tests run.'
                          return
                      }
                      $cmd = 'npm ci && npm test'
                  }
                  'powershell' {
                      $testFiles = @(Get-ChildItem -Recurse -Filter '*.Tests.ps1' -ErrorAction SilentlyContinue)
                      if ($testFiles.Count -eq 0) {
                          Write-Host '::warning::No *.Tests.ps1 files found. No tests run.'
                          return
                      }
                      Write-Host "Found $($testFiles.Count) Pester test file(s)."
                      $cmd = 'Invoke-Pester -CI'
                  }
                  default {
                      Write-Host 'No test command configured. Skipping.'
                      return
                  }
              }
          }

          Write-Host "Running: $cmd"
          Invoke-Expression $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ----------------------------------------------------------------------- review
  review:
    name: Reviewer Agent
    needs: [eligibility, flow, guard]
    if: needs.eligibility.outputs.agents == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: reviewer-token
        with:
          app-id: ${{ vars.AI_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI_REVIEWER_APP_KEY }}

      - name: Check round budget
        id: rounds
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MAX_ROUNDS: ${{ inputs.max-rounds }}
        run: |
          $reviews = gh api "/repos/$env:REPO/pulls/$env:PR_NUMBER/reviews" --paginate | ConvertFrom-Json
          $mine = @($reviews | Where-Object { $_.user.type -eq 'Bot' -and $_.state -ne 'COMMENTED' })
          Write-Host "Reviewer rounds so far: $($mine.Count) of $env:MAX_ROUNDS"
          if ($mine.Count -ge [int]$env:MAX_ROUNDS) {
              "exhausted=true" >> $env:GITHUB_OUTPUT
          } else {
              "exhausted=false" >> $env:GITHUB_OUTPUT
          }

      - name: Hand over to a human
        if: steps.rounds.outputs.exhausted == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST "/repos/$env:REPO/issues/$env:PR_NUMBER/labels" -f 'labels[]=needs-human'
          gh api -X POST "/repos/$env:REPO/issues/$env:PR_NUMBER/comments" `
                 -f body='Review round budget exhausted. Labelled `needs-human`; the agents will stand down on this pull request.'
          Write-Host '::error::Round budget exhausted.'
          exit 1

      - uses: actions/checkout@v4
        if: steps.rounds.outputs.exhausted == 'false'
        with:
          fetch-depth: 0

      # Agent definitions live in the administration repository so every participating
      # repository reviews to the same standard. Without this the --agents flag resolves
      # to nothing and the review silently degrades to a generic prompt.
      - name: Fetch shared agent definitions
        if: steps.rounds.outputs.exhausted == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ADMIN_REPO }}
          path: .governance
          sparse-checkout: agents
          sparse-checkout-cone-mode: false

      - name: Install agent definitions
        if: steps.rounds.outputs.exhausted == 'false'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .claude/agents | Out-Null
          Copy-Item .governance/agents/*.md .claude/agents/ -Force
          Get-ChildItem .claude/agents | ForEach-Object { Write-Host "agent: $($_.Name)" }

      - name: Install Claude Code
        if: steps.rounds.outputs.exhausted == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Review
        if: steps.rounds.outputs.exhausted == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL || 'opus' }}
        run: |
          claude --model "$REVIEWER_MODEL" \
                 --agents pr-reviewer \
                 --output-format json \
                 -p "Review pull request #${PR_NUMBER} using the pr-reviewer subagent. On rounds after the first, review both the updated code and the developer's replies to your earlier comments. Approve by submitting an APPROVE review, or request changes with specific, actionable comments." \
                 | tee review-result.json

      - name: Fail closed on refusal or empty output
        if: steps.rounds.outputs.exhausted == 'false'
        shell: pwsh
        run: |
          $output = Get-Content ./review-result.json -Raw -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($output)) {
              Write-Host '::error::Reviewer produced no output. That is not the same as "no findings".'
              exit 1
          }

      - name: Did the reviewer approve?
        if: steps.rounds.outputs.exhausted == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $reviews = gh api "/repos/$env:REPO/pulls/$env:PR_NUMBER/reviews" --paginate | ConvertFrom-Json
          $latest = @($reviews | Where-Object {
              $_.user.type -eq 'Bot' -and $_.commit_id -eq $env:HEAD_SHA -and $_.state -ne 'COMMENTED'
          }) | Select-Object -Last 1

          if (-not $latest) {
              Write-Host '::error::Reviewer left no verdict on the current head commit.'
              exit 1
          }
          Write-Host "Reviewer verdict: $($latest.state)"
          if ($latest.state -ne 'APPROVED') { exit 1 }

  # ---------------------------------------------------------------------- respond
  respond:
    name: Developer Agent
    needs: eligibility
    # The review author is checked, not just the review state. Any identity holding
    # pull_requests:write can submit changes_requested, and this job hands that review
    # body to an agent with contents:write — including the Developer App itself, which
    # would be a self-triggering loop. Only the Reviewer App can drive the developer.
    if: >-
      needs.eligibility.outputs.agents == 'true' &&
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.review.user.login == 'devils-advocate-review[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: developer-token
        with:
          app-id: ${{ vars.AI_DEVELOPER_APP_ID }}
          private-key: ${{ secrets.AI_DEVELOPER_APP_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.developer-token.outputs.token }}

      - name: Fetch shared agent definitions
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ADMIN_REPO }}
          path: .governance
          sparse-checkout: agents
          sparse-checkout-cone-mode: false

      - name: Install agent definitions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .claude/agents | Out-Null
          Copy-Item .governance/agents/*.md .claude/agents/ -Force

      - run: npm install -g @anthropic-ai/claude-code

      - name: Fix or rebut
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.developer-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.developer-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVELOPER_MODEL: ${{ vars.DEVELOPER_MODEL || 'sonnet' }}
        run: |
          claude --model "$DEVELOPER_MODEL" \
                 --agents pr-developer \
                 --output-format json \
                 -p "Address the open review comments on pull request #${PR_NUMBER} using the pr-developer subagent. Fix what is valid; rebut false positives with technical evidence. Do not modify anything under .github/workflows — the guard rejects it." \
                 | tee respond-result.json

      - name: Clean up borrowed files
        if: always()
        run: rm -rf .governance .claude/agents

  # ---------------------------------------------------------------------- verdict
  # Always runs. This is the only job that publishes the merge gate, so every path must
  # reach it — flow violation, guard failure, agent failure, and agents-disabled alike.
  verdict:
    name: Publish ai-review
    needs: [eligibility, flow, guard, review]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.publish.outputs.conclusion }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: reviewer-token
        with:
          app-id: ${{ vars.AI_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI_REVIEWER_APP_KEY }}

      - name: Publish check run
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.reviewer-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FLOW: ${{ needs.flow.result }}
          GUARD: ${{ needs.guard.result }}
          REVIEW: ${{ needs.review.result }}
          AGENTS: ${{ needs.eligibility.outputs.agents }}
          SKIP_REASON: ${{ needs.eligibility.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:FLOW -ne 'success') {
              $conclusion = 'failure'
              $title      = 'Invalid promotion path'
              $summary    = "This pull request does not follow feature -> ai-driven1 -> develop -> main.`n`n[Run log]($env:RUN_URL)"
          }
          elseif ($env:GUARD -ne 'success') {
              $conclusion = 'failure'
              $title      = 'Guard failed'
              $summary    = "Invariant checks or tests did not pass. Nothing was reviewed.`n`n[Run log]($env:RUN_URL)"
          }
          elseif ($env:AGENTS -ne 'true') {
              $conclusion = 'success'
              $title      = 'Guard passed (agents not run)'
              $summary    = "Promotion path, invariant checks and tests passed. AI review skipped: $env:SKIP_REASON`n`n[Run log]($env:RUN_URL)"
          }
          elseif ($env:REVIEW -ne 'success') {
              $conclusion = 'failure'
              $title      = 'Changes requested'
              $summary    = "The reviewer did not approve the current head commit. See the review comments on this pull request.`n`n[Run log]($env:RUN_URL)"
          }
          else {
              $conclusion = 'success'
              $title      = 'Approved'
              $summary    = "Promotion path, guard, tests and AI review all passed.`n`n[Run log]($env:RUN_URL)"
          }

          Write-Host "ai-review -> $conclusion ($title)"
          "conclusion=$conclusion" >> $env:GITHUB_OUTPUT
          gh api -X POST "/repos/$env:REPO/check-runs" `
                 -f name='ai-review' `
                 -f head_sha="$env:HEAD_SHA" `
                 -f status='completed' `
                 -f conclusion="$conclusion" `
                 -f "output[title]=$title" `
                 -f "output[summary]=$summary" `
                 --jq '"published check " + (.id|tostring) + " by app " + (.app.id|tostring)'

  # ------------------------------------------------------------------ auto-merge
  # develop only. Pull requests into main are merged by hand by the organisation owner.
  auto-merge:
    name: Arm auto-merge
    needs: verdict
    # The job runs on every pull request into develop and decides inside itself.
    #
    # The gate is needs.verdict.outputs.conclusion, NOT needs.verdict.result: the verdict
    # job succeeds whenever it manages to publish a check, including when the check it
    # publishes is a failure. Testing the job result armed auto-merge on guard failures,
    # which merges them outright in any repository where ai-review is not yet required.
    #
    # That gate is evaluated in a step rather than in this job-level `if` because a job
    # `if` referencing needs.<job>.outputs silently evaluated false and skipped the job
    # even when the verdict was success. Deciding in a step makes the value observable
    # in the log instead of failing invisibly.
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: developer-token
        with:
          app-id: ${{ vars.AI_DEVELOPER_APP_ID }}
          private-key: ${{ secrets.AI_DEVELOPER_APP_KEY }}

      - name: Should auto-merge be armed?
        id: gate
        shell: pwsh
        env:
          VERDICT_RESULT: ${{ needs.verdict.result }}
          VERDICT_CONCLUSION: ${{ needs.verdict.outputs.conclusion }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ steps.developer-token.outputs.token }}
        run: |
          Write-Host "verdict job result : '$env:VERDICT_RESULT'"
          Write-Host "verdict conclusion : '$env:VERDICT_CONCLUSION'"

          # Read labels live, NOT from github.event.pull_request.labels. The payload is
          # frozen at the moment the event fired, so a needs-human label added seconds
          # after `opened` is invisible to this run — verified: a labelled pull request
          # merged itself 52 seconds after being labelled.
          $labels = @(gh api "/repos/$env:REPO/issues/$env:PR_NUMBER/labels" --jq '.[].name')
          Write-Host "labels (live)      : $($labels -join ', ')"

          $reasons = @()
          # Fail closed: anything other than an explicit success leaves auto-merge off.
          if ($env:VERDICT_CONCLUSION -ne 'success') { $reasons += "verdict is '$env:VERDICT_CONCLUSION'" }

          # gh pr merge --auto errors outright on a draft, failing the run for no reason.
          if ($env:IS_DRAFT -eq 'true') { $reasons += 'pull request is a draft' }

          # needs-human means a person should look at this. Stopping the agents but still
          # merging it automatically defeats the entire point of the label.
          if ($labels -contains 'needs-human') { $reasons += 'needs-human label' }

          if ($reasons.Count -gt 0) {
              'go=false' >> $env:GITHUB_OUTPUT
              Write-Host "Not arming auto-merge: $($reasons -join '; ')"
          }
          else {
              'go=true' >> $env:GITHUB_OUTPUT
              Write-Host 'Arming auto-merge.'
          }

      # Arming is not the only state that matters. If auto-merge was armed by an earlier
      # run and the pull request has since been labelled needs-human or turned back into
      # a draft, leaving it armed means it still merges itself. Disarm explicitly.
      - name: Disarm auto-merge
        if: steps.gate.outputs.go != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.developer-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ALREADY_ARMED: ${{ github.event.pull_request.auto_merge != null }}
        run: |
          if ($env:ALREADY_ARMED -ne 'true') { Write-Host 'Auto-merge was not armed.'; exit 0 }
          Write-Host 'Auto-merge is armed but should not be. Disabling.'
          gh pr merge $env:PR_URL --disable-auto

      - name: Enable auto-merge
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.developer-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Native auto-merge: GitHub merges when every required check passes. It does not
          # bypass a single rule — if ai-review fails, the pull request simply waits.
          gh pr merge $env:PR_URL --squash --auto

      - name: Update branch if behind
        if: steps.gate.outputs.go == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.developer-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # "Require branches to be up to date before merging" leaves a stale pull request
          # sitting at mergeable_state=behind indefinitely — auto-merge waits but GitHub
          # never updates the branch on its own. Without this the automated path silently
          # stops being automated.
          $state = gh api "/repos/$env:REPO/pulls/$env:PR_NUMBER" --jq '.mergeable_state'
          Write-Host "mergeable_state: $state"
          if ($state -ne 'behind') { Write-Host 'Branch is current.'; exit 0 }

          # Merges the base into the head. The resulting push re-runs this workflow, which
          # republishes ai-review against the new head and lets auto-merge complete.
          $result = gh api -X PUT "/repos/$env:REPO/pulls/$env:PR_NUMBER/update-branch" 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Could not update the branch automatically: $result"
              Write-Host '::warning::This usually means a merge conflict. A human needs to resolve it.'
              exit 0
          }
          Write-Host 'Branch updated; a fresh run will publish the verdict.'
